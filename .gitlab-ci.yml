variables:
  # Project key used in SonarQube
  SONAR_PROJECT_KEY: "vicuna-hexa-sharp"
  # NOTE: Set SONAR_TOKEN and SONAR_HOST_URL as protected CI variables in GitLab (Settings → CI/CD → Variables)

default:
  tags:
    - docker

image: custome-dind:latest

stages:
  - build_vicuna
  - test_vicuna
  - owasp_check
  - security-scan
  - sonarqube

include:
  - local: testing.yml
    rules:
      - if: $CI_PIPELINE_SOURCE !~ "merge_request_event" && ( $CI_COMMIT_REF_SLUG == "main" ||  $CI_COMMIT_REF_SLUG == "develop")
        when: always

build_vicuna:
  allow_failure: true
  stage: build_vicuna
  tags:
    - docker
  image:
    name: mcr.microsoft.com/dotnet/sdk:10.0.400
  script:
    - echo "from Branch $CI_COMMIT_BRANCH"
    - "dotnet build vicuna-ddd.sln"

    
owasp_check:
  image:
    name: registry.gitlab.com/gitlab-ci-utils/docker-dependency-check:latest
    entrypoint: [""]
  stage: owasp_check
  tags:
    - docker
  script:
    # Job will scan the project root folder and fail if any vulnerabilities with CVSS > 0 are found
    - /usr/share/dependency-check/bin/dependency-check.sh --scan "./" -exclude "**/node_modules/**" --exclude "**/coverage-results/**" --exclude "**/bin/**" --exclude "**/obj/**" --format ALL --project "$CI_PROJECT_NAME" --failOnCVSS 0
    # Dependency Check will only fail the job based on CVSS scores, and in some cases vulnerabilities do not
    # have CVSS scores (e.g. those from NPM audit), so they don't cause failure.  To fail for any vulnerabilities    
    # grep the resulting report for any "vulnerabilities" sections and exit if any are found (count > 0).
    - if [ $(grep -c "vulnerabilities" dependency-check-report.json) -gt 0 ]; then echo "Errors found, please check"; fi
  allow_failure: true
  artifacts:
    when: always
    paths:
      # Save the HTML and JSON report artifacts
      - "./dependency-check-report.html"
      - "./dependency-check-report.json"
     
sonarqube:
  allow_failure: true
  stage: sonarqube
  tags:
    - docker
  image:
    name: mcr.microsoft.com/dotnet/sdk:10.0.400
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  before_script:
    - apt-get update && apt-get install -y libxml2
  script:
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:$HOME/.dotnet/tools"

    # 1. Start Sonar analysis (GEÄNDERT: Nutzt nun sonar.cs.opencover.reportsPaths)
    - dotnet sonarscanner begin /k:"${SONAR_PROJECT_KEY}" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.cs.opencover.reportsPaths="root-coverage.xml" /d:sonar.exclusions="coverage-results/**,coverage/**,**/dependency-check-report.html"

    # 2. Build the application inside the Sonar window
    - dotnet build vicuna-ddd.sln --no-incremental

    # 3. Collect coverage using OpenCover format
    - dotnet test vicuna-ddd.sln --collect:"XPlat Code Coverage" --results-directory "coverage-results" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.DeterministicReport=false
    
    # 4. Datei umbenennen und verschieben (Zufälligen Ordner auflösen)
    - mv coverage-results/*/*.xml ./root-coverage.xml
    - ls -la ./root-coverage.xml
    
    # 5. End analysis and upload reports
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"


  only:
    - merge_requests
    - main
    - develop
  
